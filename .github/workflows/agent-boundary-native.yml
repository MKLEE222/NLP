name: agent-sdk-native-boundary-repro
on:
  push:
    branches: [research/agent-failure-boundary-20261011]
    paths:
      - 'boundary_native/issue3280_stream_guardrail.py'
      - '.github/workflows/agent-boundary-native.yml'
  pull_request:
    paths:
      - 'boundary_native/issue3280_stream_guardrail.py'
      - '.github/workflows/agent-boundary-native.yml'
  workflow_dispatch:
jobs:
  native-sdk-historical-guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: before
            sha: 683b6e79e5b4a2e3fc3cac80b556101ce778beae
          - phase: after
            sha: 4a3d33e44fcd5051ff1b08f136ca61aef7824e63
    env:
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/openai-agents-python
          ref: ${{ matrix.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit pinned official source
        run: |
          echo "requested: ${{ matrix.sha }}"
          test "$(git -C upstream rev-parse HEAD)" = "${{ matrix.sha }}"
          python -m pip install --no-cache-dir -e upstream
          # SDK's pinned historical uv.lock on the pre-fix commit resolves openai=2.26.0.
          # The freely upgraded package changed usage InputTokensDetails and breaks both phases.
          python -m pip install --no-cache-dir 'openai==2.26.0'
          python - <<'PY'
          from importlib.metadata import version
          assert version("openai") == "2.26.0"
          print("Historical lock-compatible openai package:", version("openai"))
          PY
          python -m pip freeze > sdk_pip_freeze_${{ matrix.phase }}.txt
          python -m compileall -q boundary_native
      - name: Execute published issue 3280 without LLM API
        run: |
          mkdir -p boundary_receipts
          timeout --signal=TERM --kill-after=10s 300s python boundary_native/issue3280_stream_guardrail.py \
            --upstream-root upstream --upstream-commit ${{ matrix.sha }} \
            --phase ${{ matrix.phase }} \
            --output boundary_receipts/issue3280_${{ matrix.phase }}.json
      - name: Preserve fail/partial status and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3280-${{ matrix.phase }}
          path: |
            boundary_receipts/
            sdk_pip_freeze_${{ matrix.phase }}.txt
          if-no-files-found: warn
          retention-days: 14
