name: agent-sdk-approved-output-native
on:
  push:
    branches: [research/agent-failure-boundary-20261011]
    paths:
      - 'boundary_native/issue4125_approved_tool_orphan.py'
      - '.github/workflows/agent-approved-output-native.yml'
  pull_request:
    paths:
      - 'boundary_native/issue4125_approved_tool_orphan.py'
      - '.github/workflows/agent-approved-output-native.yml'
  workflow_dispatch:
jobs:
  native-approved-tool-orphan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: before
            sha: 6e2095d918a3875ba367ccbd9cc03ecb70ce2986
          - phase: after
            sha: 9d894a9032e8d373f8b54d81591db36ce75b315d
    env:
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/openai-agents-python
          ref: ${{ matrix.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source plus historical lock-compatible API types
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "${{ matrix.sha }}"
          python -m pip install --no-cache-dir -e upstream
          python -m pip install --no-cache-dir 'openai==2.45.0'
          python - <<'PY'
          from importlib.metadata import version
          assert version("openai") == "2.45.0"
          print("official uv.lock openai:", version("openai"))
          PY
          python -m pip freeze > openai_agents_4125_${{ matrix.phase }}_environment.txt
      - name: Native zero-API resumed approved-tool test
        run: |
          mkdir -p boundary_receipts
          timeout --signal=TERM --kill-after=10s 300s python boundary_native/issue4125_approved_tool_orphan.py \
            --upstream-root upstream --upstream-commit ${{ matrix.sha }} \
            --phase ${{ matrix.phase }} \
            --output boundary_receipts/issue4125_${{ matrix.phase }}.json
      - name: Archive native observations, not manuscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4125-${{ matrix.phase }}
          path: |
            boundary_receipts/
            openai_agents_4125_${{ matrix.phase }}_environment.txt
          if-no-files-found: warn
          retention-days: 14
