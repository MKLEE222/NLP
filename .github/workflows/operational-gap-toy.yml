name: operational-gap-public-checks
on:
  push:
    branches: [research/operational-consequence-gap-20261011]
    paths: ['operational_gap/**', '.github/workflows/operational-gap-toy.yml']
  pull_request:
    paths: ['operational_gap/**', '.github/workflows/operational-gap-toy.yml']
  workflow_dispatch:
jobs:
  mathematical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s operational_gap/tests -v
  qaedit-allocation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile operational_gap/studies/qaedit_future_collision/prepare_manifest.py
      - run: python -m unittest discover -s operational_gap/studies/qaedit_future_collision -p 'test_*.py' -v
