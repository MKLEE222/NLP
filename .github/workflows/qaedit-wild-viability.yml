name: qaedit-qwen-wild-viability
on:
  push:
    branches: [research/operational-consequence-gap-20261011]
    paths:
      - '.github/workflows/qaedit-wild-viability.yml'
  workflow_dispatch:
jobs:
  dev-only-wild-aligned-viability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproducible CPU environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir 'transformers==4.48.3' 'peft==0.14.0' 'accelerate==1.2.1' 'huggingface-hub==0.28.1' 'safetensors==0.5.3' 'numpy==1.26.4'
          free -h
      - name: Download immutable published dataset
        run: |
          mkdir -p /tmp/qaedit_cpu_pilot
          curl --fail --location --retry 3 --retry-delay 3 --silent --show-error \
            'https://raw.githubusercontent.com/WanliYoung/Revisit-Editing-Evaluation/61ccca3c1ecdb3976c9c0924e9352f3e64cc7d48/data/QAEdit.json' \
            --output /tmp/qaedit_cpu_pilot/QAEdit.json
          echo 'fab6328110cbb2912eb71945e11b12ef0606fcf5ddbd6a3fafd2fee6b6fdc4cc  /tmp/qaedit_cpu_pilot/QAEdit.json' | sha256sum --check
      - name: Same 8 development edits under WILD-aligned evaluation
        run: |
          timeout --signal=TERM --kill-after=30s 1200s \
            python operational_gap/studies/qaedit_future_collision/editor_viability_wild_dev.py \
              --dataset /tmp/qaedit_cpu_pilot/QAEdit.json \
              --report /tmp/qaedit_cpu_pilot/wild_viability_report.json
      - name: Upload feasibility report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaedit-wild-viability
          path: /tmp/qaedit_cpu_pilot/wild_viability_report.json
          if-no-files-found: warn
          retention-days: 14
